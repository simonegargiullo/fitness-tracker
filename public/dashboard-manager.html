<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker - Area Manager</title>
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div id="app" class="d-flex flex-column min-vh-100">
        
        <app-navbar></app-navbar>

        <header class="bg-primary text-white text-center pb-4" style="padding-top: 110px;">
            <div class="container">
                <h1 class="display-6 fw-bold mb-1"><i class="bi bi-shield-lock-fill text-white"></i> Pannello Manager</h1>
                <p class="mb-0 opacity-75 text-light">Gestisci il team e i cataloghi</p>
            </div>
        </header>

        <div class="container my-5 flex-grow-1">
            <div class="row g-4">
                
                <div class="col-lg-6">
                    <div class="card shadow-sm h-100 border-0 rounded-4">
                        <div class="card-header bg-dark text-white rounded-top-4 p-3">
                            <h5 class="mb-0 fw-bold"><i class="bi bi-person-badge me-2"></i> Nuovo Allenatore</h5>
                        </div>
                        <div class="card-body bg-white p-4">
                            
                            <div v-if="msgCoach.testo" :class="'alert alert-' + msgCoach.tipo" class="small fw-semibold py-2">
                                {{ msgCoach.testo }}
                            </div>

                            <form @submit.prevent="creaAllenatore">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small">Nome *</label>
                                        <input type="text" class="form-control bg-light" v-model="coach.nome" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small">Cognome *</label>
                                        <input type="text" class="form-control bg-light" v-model="coach.cognome" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small">Email Lavorativa *</label>
                                        <input type="email" class="form-control bg-light" v-model="coach.email" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small">Password Provvisoria *</label>
                                        <input type="password" class="form-control bg-light" v-model="coach.password" minlength="8" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small">Specialità</label>
                                        <input type="text" class="form-control bg-light" v-model="coach.specialita" placeholder="es. Ipertrofia">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small">Telefono</label>
                                        <input type="text" class="form-control bg-light" v-model="coach.telefono">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label fw-bold small">Foto Profilo (File)</label>
                                        <input type="file" id="file-coach" class="form-control bg-light" @change="selezionaFotoCoach" accept="image/*">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label fw-bold small">Biografia / Descrizione</label>
                                        <textarea class="form-control bg-light" rows="4" v-model="coach.descrizione" style="resize: none;"></textarea>
                                    </div>
                                </div>
                                <button type="submit" class="btn bg-primary w-100 fw-bold mt-4 py-2 text-white" :disabled="loadingCoach">
                                    <span v-if="loadingCoach" class="spinner-border spinner-border-sm me-2"></span>
                                    <i v-else class="bi bi-person-plus-fill me-2 text-white"></i> Crea Profilo
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6 d-flex flex-column gap-4">
                    
                    <div class="card shadow-sm border-0 rounded-4">
                        <div class="card-header bg-dark text-white rounded-top-4 p-3">
                            <h5 class="mb-0 fw-bold"><i class="bi bi-dumbbell me-2"></i> Aggiungi Esercizio</h5>
                        </div>
                        <div class="card-body bg-white p-4">
                            
                            <div v-if="msgEsercizio.testo" :class="'alert alert-' + msgEsercizio.tipo" class="small fw-semibold py-2">
                                {{ msgEsercizio.testo }}
                            </div>

                            <form @submit.prevent="aggiungiEsercizio" class="row g-3">
                                <div class="col-md-7">
                                    <label class="form-label fw-bold small">Nome Esercizio *</label>
                                    <input type="text" class="form-control bg-light" v-model="esercizio.nome" required>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label fw-bold small">Gruppo *</label>
                                    <select class="form-select bg-light" v-model="esercizio.gruppo_muscolare" required>
                                        <option value="" disabled>Scegli...</option>
                                        <option value="Petto">Petto</option>
                                        <option value="Dorso">Dorso</option>
                                        <option value="Gambe">Gambe</option>
                                        <option value="Spalle">Spalle</option>
                                        <option value="Braccia">Braccia</option>
                                        <option value="Core">Core</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold small">Carica Immagine / GIF</label>
                                    <input type="file" id="file-esercizio" class="form-control bg-light" @change="selezionaFotoEsercizio" accept="image/*">
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn bg-primary w-100 fw-bold text-white" :disabled="loadingEsercizio">
                                        <span v-if="loadingEsercizio" class="spinner-border spinner-border-sm me-2"></span>
                                        Aggiungi Esercizio
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="card shadow-sm border-0 rounded-4">
                        <div class="card-header bg-dark text-white rounded-top-4 p-3">
                            <h5 class="mb-0 fw-bold"><i class="bi bi-apple me-2"></i> Aggiungi Alimento (100g)</h5>
                        </div>
                        <div class="card-body bg-white p-4">
                            
                            <div v-if="msgAlimento.testo" :class="'alert alert-' + msgAlimento.tipo" class="small fw-semibold py-2">
                                {{ msgAlimento.testo }}
                            </div>

                            <form @submit.prevent="aggiungiAlimento" class="row g-2 align-items-end">
                                <div class="col-12 mb-2">
                                    <label class="form-label fw-bold small">Nome Alimento *</label>
                                    <input type="text" class="form-control bg-light" v-model="alimento.nome" required>
                                </div>
                                <div class="col-3">
                                    <label class="form-label fw-bold small text-muted">Kcal *</label>
                                    <input type="number" class="form-control bg-light px-1 text-center" v-model="alimento.calorie" required>
                                </div>
                                <div class="col-3">
                                    <label class="form-label fw-bold small text-muted">Pro(g)*</label>
                                    <input type="number" class="form-control bg-light px-1 text-center" step="0.1" v-model="alimento.proteine" required>
                                </div>
                                <div class="col-3">
                                    <label class="form-label fw-bold small text-muted">Car(g)*</label>
                                    <input type="number" class="form-control bg-light px-1 text-center" step="0.1" v-model="alimento.carboidrati" required>
                                </div>
                                <div class="col-3">
                                    <label class="form-label fw-bold small text-muted">Fat(g)*</label>
                                    <input type="number" class="form-control bg-light px-1 text-center" step="0.1" v-model="alimento.grassi" required>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn bg-primary w-100 fw-bold text-white" :disabled="loadingAlimento">
                                        <span v-if="loadingAlimento" class="spinner-border spinner-border-sm me-2"></span>
                                        Salva Alimento
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <app-footer></app-footer>

    </div> 

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script src="js/components.js"></script>
    <script src="js/dashboard-manager.js"></script>
</body>
</html>
