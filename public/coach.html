<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker - Il nostro Team</title>
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div id="app" class="d-flex flex-column min-vh-100">
        
        <app-navbar></app-navbar>

        <header class="page-header">
            <div class="container">
                <h6 class="text-primary fw-bold text-uppercase tracking-wide">I professionisti</h6>
                <h1 class="display-4 fw-bold mb-3">Il Nostro <span class="text-primary">Team</span></h1>
                <p class="lead text-light opacity-75 mx-auto" style="max-width: 600px;">
                    Scegli l'allenatore certificatopiù adatto alle tue esigenze. Ogni coach è pronto a seguirti passo dopo passo nel tuo percorso.
                </p>
            </div>
        </header>

        <section class="container my-5 py-4 flex-grow-1">
            <div class="row g-4 justify-content-center">
                
                <div class="col-md-6 col-lg-4" v-for="coach in coaches" :key="coach.id">
                    <div class="card hover-card bg-white h-100 shadow-sm border-0">
                        <img :src="coach.foto" class="card-img-top coach-img" :alt="coach.nome">
                        
                        <div class="card-body p-4 d-flex flex-column">
                            <h4 class="fw-bold mb-1">{{ coach.nome }}</h4>
                            <p class="text-primary fw-semibold small text-uppercase mb-3">
                                <i class="bi bi-star-fill me-1"></i> {{ coach.specialita }}
                            </p>
                            <p class="text-muted flex-grow-1">
                                "{{ coach.descrizione }}"
                            </p>
                            <a href="registrati.html" class="btn btn-outline-primary fw-bold w-100 rounded-pill mt-3">
                                Scegli {{ coach.nome.split(' ')[0] }}
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <app-footer></app-footer>

    </div> 

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script src="js/components.js"></script>
    <script src="js/coach.js"></script> </body>
</html>
