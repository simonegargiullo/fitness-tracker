<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - Fitness Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-activity"></i> Fitness Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="team.html">I Nostri Allenatori</a></li>
                    <li class="nav-item"><a class="nav-link" href="contatti.html">Contatti</a></li>
                </ul>
                <div class="d-flex gap-2">
                    <a href="registrati.html" class="btn btn-primary">Registrati</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-circle text-primary display-4"></i>
                        <h3 class="mt-2 fw-bold">Bentornato</h3>
                        <p class="text-muted">Accedi al tuo account</p>
                    </div>

                    <div id="messaggio-alert" class="alert d-none text-center" role="alert"></div>

                    <form id="form-login">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" id="email" class="form-control form-control-lg" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Password</label>
                            <input type="password" id="password" class="form-control form-control-lg" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Accedi</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p>Non hai un account? <a href="registrati.html" class="text-decoration-none fw-bold">Registrati qui</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">© 2024 Fitness Tracker - Progetto Esame Marconi</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#form-login').on('submit', function(e) {
                e.preventDefault();

                const credenziali = {
                    email: $('#email').val(),
                    password: $('#password').val()
                };

                $('#messaggio-alert').addClass('d-none');

                $.ajax({
                    url: '/api/login',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(credenziali),
                    success: function(response) {
                        // Il server ci dirà che ruolo ha l'utente, così lo mandiamo alla pagina giusta
                        if (response.ruolo === 'manager') {
                            window.location.href = 'dashboard-manager.html';
                        } else if (response.ruolo === 'allenatore') {
                            window.location.href = 'dashboard-allenatore.html';
                        } else if (response.ruolo === 'sportivo') {
                            window.location.href = 'dashboard-sportivo.html';
                        }
                    },
                    error: function(xhr) {
                        const errorMessage = xhr.responseJSON ? xhr.responseJSON.message : 'Errore di connessione.';
                        $('#messaggio-alert').text(errorMessage).removeClass('d-none').addClass('alert-danger');
                    }
                });
            });
        });
    </script>
</body>
</html>
