<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - Fitness Tracker</title>
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Wrapper di Vue.js -->
    <div id="app" class="d-flex flex-column min-vh-100">
        
        <!-- Componente Navbar Dinamica -->
        <app-navbar></app-navbar>

        <!-- Spaziatore per la navbar fissa -->
        <div style="margin-top: 76px;"></div>

        <div class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        
                        <div class="text-center mb-4">
                            <i class="bi bi-person-circle text-primary" style="font-size: 3.5rem;"></i>
                            <h3 class="mt-2 fw-bold">Bentornato</h3>
                            <p class="text-muted">Accedi al tuo account per continuare</p>
                        </div>

                        <!-- Alert per messaggi di Errore/Successo -->
                        <div v-if="msg.testo" :class="'alert alert-' + msg.tipo" class="small fw-bold text-center py-2 fade show" role="alert">
                            {{ msg.testo }}
                        </div>

                        <!-- Form di Login gestito da Vue -->
                        <form @submit.prevent="eseguiLogin">
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Indirizzo Email</label>
                                <input type="email" class="form-control form-control-lg bg-light" v-model="form.email" required placeholder="Es. mario.rossi@email.com">
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold small">Password</label>
                                <input type="password" class="form-control form-control-lg bg-light" v-model="form.password" required placeholder="Inserisci la tua password">
                            </div>
                            
                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow-sm" :disabled="loading">
                                <span v-if="loading" class="spinner-border spinner-border-sm me-2"></span>
                                <i v-else class="bi bi-box-arrow-in-right me-2 text-white"></i> <span class="text-white">Accedi</span>
                            </button>
                        </form>
                        
                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="text-muted small mb-0">Non hai un account? <a href="registrati.html" class="text-primary text-decoration-none fw-bold">Registrati qui</a></p>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- Componente Footer Dinamico -->
        <app-footer></app-footer>

    </div>

    <!-- Script essenziali -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <!-- I nostri script -->
    <script src="js/components.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
