<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrati - Fitness Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html"
          ><i class="bi bi-activity"></i> Fitness Tracker</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="team.html">I Nostri Allenatori</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contatti.html">Contatti</a>
            </li>
          </ul>
          <div class="d-flex gap-2">
            <a href="login.html" class="btn btn-outline-light">Accedi</a>
          </div>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white text-center py-3">
              <h4 class="mb-0">Crea il tuo profilo Sportivo</h4>
            </div>
            <div class="card-body p-4">
              <div
                id="messaggio-alert"
                class="alert d-none text-center"
                role="alert"
              ></div>

              <form id="form-registrazione">
                <h5 class="mb-3 border-bottom pb-2 text-primary">
                  1. Credenziali di Accesso
                </h5>
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Nome Completo</label>
                    <input
                      type="text"
                      id="nome"
                      class="form-control"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Email</label>
                    <input
                      type="email"
                      id="email"
                      class="form-control"
                      required
                    />
                  </div>
                </div>
                <div class="row mb-4">
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Password</label>
                    <input
                      type="password"
                      id="password"
                      class="form-control"
                      required
                    />
                  </div>
                </div>

                <h5 class="mb-3 border-bottom pb-2 text-primary">
                  2. Parametri Fisici
                </h5>
                <div class="row mb-3">
                  <div class="col-md-4">
                    <label class="form-label fw-bold">Sesso</label>
                    <select id="sesso" class="form-select" required>
                      <option value="">Seleziona...</option>
                      <option value="M">Uomo</option>
                      <option value="F">Donna</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-bold">Età</label>
                    <input
                      type="number"
                      id="eta"
                      class="form-control"
                      min="16"
                      max="99"
                      required
                    />
                  </div>
                </div>
                <div class="row mb-4">
                  <div class="col-md-4">
                    <label class="form-label fw-bold">Peso (kg)</label>
                    <input
                      type="number"
                      id="peso"
                      class="form-control"
                      step="0.1"
                      required
                    />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-bold">Altezza (cm)</label>
                    <input
                      type="number"
                      id="altezza"
                      class="form-control"
                      required
                    />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-bold">Obiettivo</label>
                    <select id="obiettivo" class="form-select" required>
                      <option value="">Seleziona...</option>
                      <option value="Dimagrimento">Dimagrimento</option>
                      <option value="Massa">Aumento Massa</option>
                      <option value="Mantenimento">Mantenimento</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-bold">Attitudini</label>
                    <select id="attitudini" class="form-select" required>
                      <option value="">Seleziona...</option>
                      <option value="Sedentario">Sedentario</option>
                      <option value="Poco">Poco Attivo</option>
                      <option value="Attivo">Attivo</option>
                      <option value="Molto">Molto Attivo</option>
                    </select>
                  </div>
                  <div class="row mb-4">
                    <div class="col-12">
                      <label class="form-label fw-bold"
                        >Esperienza Pregressa</label
                      >
                      <textarea
                        id="esperienza_pregressa"
                        class="form-control"
                        rows="3"
                        placeholder="Raccontaci brevemente il tuo rapporto con l'allenamento (es. infortuni passati, sport praticati...)"
                      ></textarea>
                    </div>
                  </div>
                </div>

                <div class="d-grid mt-4">
                  <button type="submit" class="btn btn-primary btn-lg fw-bold">
                    Registrati e Inizia
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
      <p class="mb-0">© 2024 Fitness Tracker - Progetto Esame Marconi</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      $(document).ready(function () {
        $("#form-registrazione").on("submit", function (e) {
          e.preventDefault();

          // Creiamo l'oggetto JSON con tutti i dati
          const datiSportivo = {
            nome: $("#nome").val(),
            email: $("#email").val(),
            password: $("#password").val(),
            sesso: $("#sesso").val(),
            eta: $("#eta").val(),
            peso: $("#peso").val(),
            altezza: $("#altezza").val(),
            obiettivo: $("#obiettivo").val(),
            attitudini: $("#attitudini").val(),
            esperienza_pregressa: $("#esperienza_pregressa").val(),
          };

          // Nascondiamo l'alert prima di inviare
          $("#messaggio-alert")
            .addClass("d-none")
            .removeClass("alert-success alert-danger");

          // Inviamo al server
          $.ajax({
            url: "/api/registrati",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify(datiSportivo),
            success: function (response) {
              $("#messaggio-alert")
                .text(response.message)
                .removeClass("d-none")
                .addClass("alert-success");
              $("#form-registrazione")[0].reset(); // Svuota i campi
              // Tra 2 secondi lo mandiamo alla pagina di login
              setTimeout(() => {
                window.location.href = "login.html";
              }, 2000);
            },
            error: function (xhr) {
              const errorMessage = xhr.responseJSON
                ? xhr.responseJSON.message
                : "Errore di connessione.";
              $("#messaggio-alert")
                .text(errorMessage)
                .removeClass("d-none")
                .addClass("alert-danger");
            },
          });
        });
      });
    </script>
  </body>
</html>
