<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrati - Fitness Tracker</title>
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-light d-flex flex-column min-vh-100">

    <!-- Wrapper Vue.js -->
    <div id="app" class="d-flex flex-column min-vh-100">
        
        <!-- Componente Navbar Dinamica -->
        <app-navbar></app-navbar>

        <!-- Spaziatore per la navbar fissa -->
        <div style="margin-top: 76px;"></div>

        <div class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
            <div class="col-lg-8 col-xl-7">
                <div class="card shadow border-0 rounded-4">
                    
                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Intestazione in stile "Accedi" -->
                        <div class="text-center mb-4">
                            <i class="bi bi-person-plus text-primary" style="font-size: 3.5rem;"></i>
                            <h3 class="mt-2 fw-bold">Crea il tuo profilo</h3>
                            <p class="text-muted mb-1">Registrati come sportivo per iniziare ad allenarti</p>
                            <p class="text-muted small fst-italic">I campi contrassegnati da * sono obbligatori.</p>
                        </div>

                        <!-- Alert per messaggi di Errore/Successo -->
                        <div v-if="msg.testo" :class="'alert alert-' + msg.tipo" class="small fw-bold text-center py-2 fade show" role="alert">
                            {{ msg.testo }}
                        </div>

                        <!-- Form gestito da Vue -->
                        <form @submit.prevent="eseguiRegistrazione">
                            
                            <!-- SEZIONE 1 -->
                            <h5 class="mb-3 border-bottom pb-2 fw-bold"><span class="text-primary">1.</span> Credenziali di Accesso</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Nome Completo *</label>
                                    <input type="text" class="form-control bg-light" v-model="form.nome" required placeholder="Es. Mario Rossi">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Email *</label>
                                    <input type="email" class="form-control bg-light" v-model="form.email" required placeholder="Es. mario@email.com">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Password *</label>
                                    <input type="password" class="form-control bg-light" v-model="form.password" minlength="8" required placeholder="Almeno 8 caratteri">
                                </div>
                            </div>

                            <!-- SEZIONE 2 -->
                            <h5 class="mb-3 border-bottom pb-2 fw-bold mt-4"><span class="text-primary">2.</span> Parametri Fisici</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label class="form-label fw-bold small">Sesso *</label>
                                    <select class="form-select bg-light" v-model="form.sesso" required>
                                        <option value="" disabled>Seleziona...</option>
                                        <option value="M">Uomo</option>
                                        <option value="F">Donna</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold small">Età *</label>
                                    <input type="number" class="form-control bg-light" v-model="form.eta" min="16" max="99" required placeholder="Anni">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold small">Peso (kg) *</label>
                                    <input type="number" class="form-control bg-light" v-model="form.peso" step="0.1" required placeholder="Es. 70.5">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold small">Altezza (cm) *</label>
                                    <input type="number" class="form-control bg-light" v-model="form.altezza" required placeholder="Es. 175">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold small">Obiettivo *</label>
                                    <select class="form-select bg-light" v-model="form.obiettivo" required>
                                        <option value="" disabled>Seleziona...</option>
                                        <option value="Dimagrimento">Dimagrimento</option>
                                        <option value="Massa">Aumento Massa</option>
                                        <option value="Mantenimento">Mantenimento</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold small">Attitudini *</label>
                                    <select class="form-select bg-light" v-model="form.attitudini" required>
                                        <option value="" disabled>Seleziona...</option>
                                        <option value="Sedentario">Sedentario</option>
                                        <option value="Poco">Poco Attivo</option>
                                        <option value="Attivo">Attivo</option>
                                        <option value="Molto">Molto Attivo</option>
                                    </select>
                                </div>
                                <div class="col-12 mt-3">
                                    <label class="form-label fw-bold small">Esperienza Pregressa</label>
                                    <textarea class="form-control bg-light" v-model="form.esperienza_pregressa" rows="3" style="resize: none;"
                                        placeholder="Raccontaci brevemente il tuo rapporto con l'allenamento (es. infortuni passati, sport praticati...)"></textarea>
                                </div>
                            </div>

                            <div class="mt-5">
                                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow-sm" :disabled="loading">
                                    <span v-if="loading" class="spinner-border spinner-border-sm me-2"></span>
                                    <i v-else class="bi bi-check2-circle me-2 text-white"></i> <span class="text-white">Registrati e Inizia</span>
                                </button>
                            </div>

                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="text-muted small mb-0">Hai già un account? <a href="login.html" class="text-primary text-decoration-none fw-bold">Accedi qui</a></p>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- Componente Footer Dinamico -->
        <app-footer></app-footer>

    </div>

    <!-- Script essenziali -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <!-- I nostri script -->
    <script src="js/components.js"></script>
    <script src="js/registrati.js"></script>
  </body>
</html>
